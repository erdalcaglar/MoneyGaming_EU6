<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="description" content="Kelimelerle Almanca cümle kur, gramerini anında öğren." />
    <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1218" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Deutsch" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* Body scrolling is handled by the app's own scroll views */
      body {
        overflow: hidden;
        margin: 0;
        background: #f3f5f8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1218;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Bu uygulamayı kullanmak için JavaScript'i açman gerekiyor.</noscript>
    <div id="root"></div>
  </body>
</html>
